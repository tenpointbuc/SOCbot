# Pinned images for the core stack. render.py merges site.security.images.overrides
# on top of these and FAILS if any resulting ref is bare :latest / untagged when
# security.images.pin is true (§9). Bump deliberately; Diun/Trivy still watch.
images:
  nginx-proxy-manager: jc21/nginx-proxy-manager:2.12.1
  pihole: pihole/pihole:2024.07.0
  # socket-proxy: linuxserver's fork, NOT tecnativa. On tecnativa 0.3.0 the global
  # `deny unless METH_GET || POST` rule precedes the ALLOW_RESTARTS allow, so with
  # POST=0 the restart grant is unreachable (restart => 403) and the only way to
  # enable restarts is coarse POST=1 — which also opens /containers/create =>
  # host root (§8 P0-1 explicitly forbids this). linuxserver evaluates the
  # ALLOW_* allowlist BEFORE the POST deny, so POST=0 + ALLOW_RESTARTS=1 grants
  # restart-only as designed. Digest-pinned (strongest pin) — v3.4.2-r0-ls89.
  socket-proxy: lscr.io/linuxserver/socket-proxy@sha256:b3c91258489c6d6ef26f20e9681177e3e861798466a2b85a3572ee0464c5e088
