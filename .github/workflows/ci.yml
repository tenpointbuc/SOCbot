name: CI
# Both jobs must pass before merge. This is the second approval gate:
# a Slack approval alone never ships agent-written code — approval + green CI does.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml     — config.py's one runtime dependency (system-wide on the reference host)
      # jinja2     — render.py's compose renderer; without it the P1-5 render-stamp
      #              check in tests/hardening_checks.py degrades to SKIP
      # jsonschema — preflight.py's schema gate. Without it preflight reports
      #              "jsonschema not installed" and the P1-7 closed-island schema is
      #              never actually enforced anywhere. CI is where that gets proven.
      # Versions pinned in requirements.txt — the single source of truth (BUC-9).
      - name: Install bundle Python deps
        run: pip install -r requirements.txt
      - name: QA suite (Role 3 — tooling & adapters)
        run: bash tests/run-qa.sh
      - name: QA suite (validation layer — validate.py, fallback matrix, preflight, secret scan)
        # NSB_QA_STRICT_DEPS=1: a missing dep must fail CI, never silently skip rows.
        run: NSB_QA_STRICT_DEPS=1 bash tests/run-validate-qa.sh
      - name: Bundle secret scan
        run: python3 scripts/secret-scan.py --root . --no-value

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
