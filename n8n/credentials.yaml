# noc-soc-bundle — n8n credentials provisioned VIA THE API (§7 P0-3).
# import.py creates each of these before importing workflows and rewrites node
# credential refs (matched by `name`) to the created ids. Field VALUES come from
# the secrets backend at import time via NOCSOC_SECRET_<KEY> env — never from the
# workflow templates, never from $env inside n8n, never logged.
#
# `data:` maps an n8n credential field -> a secrets-manifest key. The importer
# reads NOCSOC_SECRET_<KEY> for each.

credentials:
  - name: "noc-soc notifier bot"
    type: telegramApi            # for notifier.adapter == telegram
    data:
      accessToken: NOTIFIER_TOKEN   # manifest key; value from the backend, not $env
