# Copy to inventory.ini and edit. One host per tenant (Model A, §8).
[noc_soc]
noc-soc-host ansible_host=192.0.2.13 ansible_user=operator

[noc_soc:vars]
# Path to the resolved site.yaml consumed by the playbook (defaults to
# config/site.example.yaml if unset). Point this at the real per-site config.
nsb_site_config=../config/site.example.yaml
# Directory where render.py wrote site.env + rendered compose (bootstrap sets this).
nsb_rendered_dir=../rendered
