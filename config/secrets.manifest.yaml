# noc-soc-bundle — required-keys manifest (BUC-3 design §7).
# key -> { modules it is required by, consumers it is injected into }.
# A value is stored ONCE in the secrets backend and never hand-duplicated.
# preflight.py fails closed if any required key for an ENABLED module is
# missing from the backend, and checks file mode/owner (600 file / 700 dir).
#
# Backend (default env-file, §7): one file per key at
#   <secrets_dir>/<KEY>            (mode 600, dir 700, owner the service user)
# where <secrets_dir> defaults to /etc/noc-soc/secrets.
# Consumers marked *_FILE are mounted as files into containers (preferred over
# env_file, §7 P0-2). NOTE: Role 3 (BUC-8) owns the canonical manifest content;
# this is the Role 2 reference used to drive preflight + compose secret mounts.

secrets:
  NOTIFIER_TOKEN:
    modules: [core]
    consumers: [n8n-cred, notify.sh]      # telegram bot token / slack webhook
    rotate: reinject-restart
  N8N_ENCRYPTION_KEY:
    modules: [noc]
    consumers: [n8n]                       # mounted as N8N_ENCRYPTION_KEY_FILE
    rotate: reprovision-credentials        # un-rotatable-in-place (§7 P1-1)
  PIHOLE_WEBPASSWORD:
    modules: [core]
    consumers: [pihole]                    # mounted as file (WEBPASSWORD_FILE)
    rotate: reinject-restart
  RESTIC_PASSWORD:
    modules: [backup]
    consumers: [backup.sh]                 # RESTIC_PASSWORD_FILE
    rotate: manual-repo-rekey              # top-tier: restore re-materializes all secrets (§7 P1-5)
  B2_ACCOUNT_ID:
    modules: [backup]
    consumers: [backup.sh]
  B2_ACCOUNT_KEY:
    modules: [backup]
    consumers: [backup.sh]
  FORTIGATE_API_TOKEN:
    modules: [firewall_fortigate]
    consumers: [firewall.py]
  ANTHROPIC_API_KEY:
    modules: [llm, agent_runtime]
    consumers: [agent-run.sh]              # stored once, referenced by both modules
  IMMICH_DB_PASSWORD:
    modules: [media_immich]
    consumers: [immich_postgres]           # via *_FILE mount
  IMMICH_API_KEY:
    modules: [media_immich]
    consumers: [n8n-cred]
  PROXY_NPM_PASSWORD:
    modules: [core]
    consumers: [proxy/npm.sh]              # NPM admin password (proxy.adapter == npm)
    rotate: reinject-restart
    optional_when: "proxy.adapter != npm"

# runtime env-var mapping (Role 3 contract): how a backend key is exposed to the
# tooling/adapters at runtime. The secrets role injects each key's value into the
# named env var(s) for the consumer process; adapters read ONLY these, never a
# file path or $env inside n8n. Keeps the adapter code host-agnostic.
runtime_env_map:
  NOTIFIER_TOKEN:      [ NOCSOC_NOTIFIER_TOKEN ]        # notify.sh telegram/slack/webhook adapters
  FORTIGATE_API_TOKEN: [ NOCSOC_FIREWALL_API_TOKEN ]    # tooling/lib/firewall.py fortigate adapter
  PIHOLE_WEBPASSWORD:  [ NOCSOC_DNS_PIHOLE_PASSWORD ]   # adapters/dns/pihole.sh
  PROXY_NPM_PASSWORD:  [ NOCSOC_PROXY_NPM_PASSWORD ]    # adapters/proxy/npm.sh (email via site config)
  ANTHROPIC_API_KEY:   [ ANTHROPIC_API_KEY ]            # agent-run.sh
  # n8n credential fields are provisioned via the n8n API from NOCSOC_SECRET_<KEY>
  # (see n8n/credentials.yaml + n8n/import.py) — never injected as n8n $env.

# module-enablement mapping: which manifest module names are active for a site.
# Derived by preflight from site.yaml (adapters + modules + services), but
# stated here so the required-key set is auditable.
module_enablement:
  core:              always
  noc:               always
  backup:            "backup.adapter == restic"
  firewall_fortigate: "firewall.adapter == fortigate"
  llm:               "modules.llm == true"
  agent_runtime:     always            # agent cron needs ANTHROPIC_API_KEY
  media_immich:      "modules.media == true"
